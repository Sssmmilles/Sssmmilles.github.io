<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sssmmilles</title>
<meta name="description" content="Sssmmilles Infoz.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Sssmmilles">
<meta property="og:description" content="About Sssmmilles">
<meta property="og:url" content="https://sssmmilles.github.io/">
<meta property="og:image" content="https://sssmmilles.github.io/Images/Profile/SssAvatar.png">
<meta name="theme-color" content="#17372f">
<link rel="icon" href="Images/Web/Favicon.png" type="image/png">
<link rel="canonical" href="https://sssmmilles.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap">
<script>
  document.documentElement.classList.add('js');
  setTimeout(() => document.documentElement.classList.add('ready'), 2500);
</script>
<style>
  @font-face {
    font-family: 'KiwiSoda';
    src: url('Fonts/KiwiSoda.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --text: #e8eeed;
    --muted: #a9bab7;
    --panel: rgba(255, 255, 255, .065);
    --button: rgba(255, 255, 255, .08);
    --button-hover: rgba(255, 255, 255, .16);
    --accent: #5df2b0;
    --link: #7ab4ff;
    --card: #0f2522;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    min-height: 100vh;
    font-family: 'gg sans', 'Noto Sans', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
    background: #091514;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(8, 22, 20, .84), rgba(8, 20, 19, .97) 70%),
      url('Images/Profile/SssBanner.png') center / cover no-repeat;
    image-rendering: pixelated;
  }

  /* ---------- полоса прокрутки ---------- */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: #0a1918; }
  ::-webkit-scrollbar-thumb { min-height: 40px; border: 3px solid #0a1918; border-radius: 4px; background: linear-gradient(#5df2b0, #1f6b47); }
  ::-webkit-scrollbar-thumb:hover { border-width: 2px; background: #5df2b0; }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* Firefox */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: #2f9c70 #0a1918; }
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img.pixel { image-rendering: pixelated; }
  .icon { width: 18px; height: 18px; flex: none; fill: currentColor; }

  /* ---------- плавное открытие ---------- */
  .reveal { transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1); }
  .js .reveal { opacity: 0; transform: translateY(24px) scale(.98); }
  .js.ready .reveal { opacity: 1; transform: none; }
  .js.ready .content.reveal { transition-delay: .15s; }
  body::before { transition: opacity 1.2s ease; }
  .js body::before { opacity: 0; }
  .js.ready body::before { opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .modal {
    width: 100%;
    max-width: 1200px;
    margin: auto 0;
    display: grid;
    grid-template-columns: 500px minmax(0, 1fr);
    gap: 40px;
    align-items: start;
  }

  /* ---------- карточка профиля ---------- */
  .profile {
    background: linear-gradient(175deg, #17372f 0%, var(--card) 45%, #0b1420 100%);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
    overflow: visible;
  }
  .profile > .banner { border-radius: 10px 10px 0 0; }
  .zoom { display: block; width: 100%; overflow: hidden; cursor: pointer; }
  .zoom img { display: block; width: 100%; transition: transform .4s, filter .4s; }
  .zoom:hover img, .zoom:focus-visible img { filter: brightness(1.08); }
  .banner:hover img, .banner:focus-visible img,
  .server-banner:hover img, .server-banner:focus-visible img,
  .post .zoom:hover img, .post .zoom:focus-visible img { transform: scale(1.05); }
  .zoom:focus-visible { outline-offset: -3px; }
  .banner img { aspect-ratio: 680 / 240; object-fit: cover; }

  .head { position: relative; height: 90px; }
  .avatar {
    position: absolute;
    left: 32px;
    top: -76px;
    width: 156px;
    height: 156px;
    border: 0px solid #fff0;
    border-radius: 8px;
    background: transparent;
    transition: 0.2s ease;
  }
  .avatar:hover { transform: scale(1.04); }
  .avatar img { height: 100%; object-fit: cover; border-radius: 4px; }

  .body { padding: 0 40px 32px; }
  .name {
    font-family: 'KiwiSoda', 'Noto Sans', sans-serif;
    font-size: 38px;
    line-height: 1.2;
    color: #b9ffde;
    text-shadow: 0 0 4px var(--accent), 0 0 14px rgba(93, 242, 176, .6);
    overflow-wrap: anywhere;
    width: fit-content;
    max-width: calc(100% + 28px);
    margin: -10px -14px;
    padding: 10px 14px;
    cursor: default;
    user-select: none;
    touch-action: pan-y;
  }
  .name span { display: inline-block; white-space: pre; cursor: grab; touch-action: none; }
  .name.dragging span { cursor: grabbing; }
  .name span.dragging-letter { position: relative; z-index: 50; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; font-size: 15px; }

  .badges { position: relative; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 8px; background: var(--button); }
  .badges:empty { display: none; }
  .badge { display: grid; padding: 3px; }
  .badge img { width: 20px; height: 20px; transition: transform .3s; }
  .badge:hover img, .badge:focus-visible img { transform: scale(1.25); }
  .badge-card {
    position: fixed;
    z-index: 20;
    width: 240px;
    padding: 18px 16px 16px;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(143, 196, 182, .2) 0%, rgba(49, 83, 78, .1) 42%, rgba(49, 83, 78, .035) 64%, transparent 82%),
      #0f2422;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .6);
    text-align: center;
    pointer-events: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px) scale(.96);
    transition: opacity .15s, transform .15s, visibility .15s;
  }
  .badge-card.show { opacity: 1; visibility: visible; transform: none; }
  .badge-card::after {
    content: "";
    position: absolute;
    left: var(--arrow, 50%);
    bottom: -7px;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    border: solid rgba(255, 255, 255, .08);
    border-width: 0 1px 1px 0;
    background: #0f2422;
    transform: rotate(45deg);
  }
  .badge-card.below { transform-origin: top; }
  .badge-card.below::after { bottom: auto; top: -7px; border-width: 1px 0 0 1px; }
  .badge-card img {
    display: block;
    width: 112px;
    height: 112px;
    margin: 0 auto 12px;
    padding: 16px;
    object-fit: contain;
    border-radius: 0;
    background: transparent;
    transition: 0.2s ease;
  }
  .badge-card img:hover { transform: scale(1.14); }
  .badge-card b { display: block; font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
  .badge-card p { margin-top: 4px; color: var(--muted); font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }

  .actions { position: relative; display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 40px;
    height: 40px;
    padding: 0 12px;
    border-radius: 9px;
    background: var(--button);
    box-shadow: 0 0 0 transparent;
    font-weight: 500;
    transition: background .2s, transform .2s, box-shadow .2s;
  }
  .btn:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
    box-shadow: 0 3px 0 #535c5c63;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #535c5c63;
  }
  .btn.primary {
    padding: 0 18px;
    background: #1f6b47;
    box-shadow: 0 0 0 transparent;
  }
  .btn.primary:hover {
    background: #28855a;
    box-shadow: 0 3px 0 #1b5041;
  }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b5041; }

  .menu {
    position: absolute;
    top: 46px;
    left: 0;
    z-index: 5;
    min-width: 210px;
    padding: 6px;
    border-radius: 9px;
    background: #182a29;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    animation: rise .2s ease;
  }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; }
  .menu button:hover { background: var(--button-hover); }
  .menu .icon { width: 15px; height: 15px; color: var(--muted); }

  .section { margin-top: 16px; }
  .section > h2 { margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .bio { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .bio h3 { margin: 6px 0 4px; padding-left: 15px; border-left: 4px solid rgba(255, 255, 255, .25); border-radius: 2px; font-size: 15px; }
  .bio .item::before { content: "• "; }
  .rich a { color: var(--link); }
  .rich a:hover { text-decoration: underline; }

  .connections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .connections a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px; background: var(--panel); box-shadow: 0 0 0 transparent; transition: background .2s, transform .2s, box-shadow .2s; }
  .connections a:hover { background: var(--button-hover); transform: translateY(-2px); box-shadow: 0 3px 0 #535c5c63; }
  .logo-box { flex: 0 0 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; background: var(--c, #333); color: #fff; }
  img.logo-box { padding: 2px; }
  .connections span {
    position: relative;
    flex: 1;
    min-width: 0;
    padding-right: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .connections span::after {
    content: "›";
    position: absolute;
    right: 0;
    top: 0;
    color: var(--muted);
  }

  .line { display: block; width: 100%; opacity: .5; border-radius: 0 0 6px 6px; }

  /* ---------- вкладки ---------- */
  .content { min-width: 0; }
  .tabs { display: flex; gap: 26px; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, .08); overflow-x: auto; }
  .tabs .icon { width: 18px; height: 18px; flex: none; }
  .tabs button { display: inline-flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 2px solid transparent; font-size: 16px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .2s, border-color .2s; padding-top: 12px; }
  .tabs button:hover { color: var(--text); }
  .tabs button:focus-visible { outline-offset: -2px; }
  .tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
  [role="tabpanel"] { animation: rise .2s ease; }

  .panel { margin-bottom: 16px; padding: 18px 20px 22px; border-radius: 16px; background: rgba(27, 44, 42, .92); }
  .panel h2 { font-size: 16px; font-weight: 500; }
  .muted { color: var(--muted); }

  .post { animation: rise .4s ease; }
  .post header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .post header img { width: 42px; height: 42px; border-radius: 6px; }
  .post header b { display: block; font-size: 15px; }
  .post time { color: var(--muted); font-size: 12px; }
  .post h3 { margin-bottom: 6px; font-size: 18px; }
  .post .text { font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; }
  .post .zoom { margin-top: 12px; border-radius: 10px; }

  .art { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .art .zoom { aspect-ratio: 1; border-radius: 9px; }
  .art img { height: 100%; object-fit: cover; }
  .art .zoom { position: relative; transition: transform .25s ease, box-shadow .25s ease; }
  .art .zoom:hover, .art .zoom:focus-visible { z-index: 1; transform: scale(1.08); box-shadow: 0 10px 24px rgba(0, 0, 0, .55); }

  .server { text-align: center; }
  .server .server-banner { border-radius: 10px; }
  .server-banner img { aspect-ratio: 2400 / 760; object-fit: cover; }
  .server-links { display: grid; gap: 10px; width: 100%; margin-top: 16px; }
  .server-links .btn { justify-content: flex-start; height: 46px; padding: 0 16px; }
  .server-links .btn span { flex: 1; text-align: left; }
  .server-links .btn::after { content: "›"; opacity: .6; }

  /* ---------- просмотр картинок ---------- */
  .viewer { width: 100%; height: 100%; max-width: 100%; max-height: 100%; border: 0; background: transparent; color: var(--text); }
  .viewer[open] { display: flex; align-items: center; justify-content: center; animation: fade .15s ease; }
  .viewer::backdrop { background: rgba(2, 8, 7, .92); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } }
  .viewer .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; user-select: none; }
  .stage img { flex: none; border-radius: 6px; cursor: zoom-in; will-change: transform; }
  #viewer-img { image-rendering: pixelated; }
  .stage img.zoomed { cursor: grab; }
  .stage img.smooth { transition: transform .2s ease; }
  .stage:active img.zoomed { cursor: grabbing; }
  .viewer button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(20, 40, 37, .85); }
  .viewer button:hover { background: #2f514b; }
  .viewer .close, .viewer .prev, .viewer .next { position: absolute; z-index: 2; }
  .viewer .close { top: 16px; right: 16px; }
  .viewer .prev { left: 12px; top: calc(50% - 22px); }
  .viewer .next { right: 12px; top: calc(50% - 22px); }
  .viewer-bar { position: absolute; z-index: 2; left: 50%; bottom: 12px; transform: translateX(-50%); display: grid; justify-items: center; gap: 6px; text-align: center; white-space: nowrap; }
  .viewer-bar p { padding: 3px 12px; border-radius: 7px; background: rgba(2, 8, 7, .75); }
  .viewer-bar a { color: var(--link); }
  .zoom-tools { display: flex; align-items: center; gap: 8px; }
  .zoom-tools output { min-width: 56px; padding: 3px 6px; border-radius: 7px; background: rgba(2, 8, 7, .75); }
  body:has(.viewer[open]) { overflow: hidden; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 16px; border-radius: 9px; background: #1f6b47; animation: fade .2s ease; }

  /* ---------- телефон и узкий экран ---------- */
  @media (max-width: 960px) {
    body { padding-bottom: 96px; }
    .modal { grid-template-columns: minmax(0, 500px); justify-content: center; }

    /* ссылки — только значки */
    .connections { display: flex; flex-wrap: wrap; gap: 10px; }
    .connections a { padding: 0; background: none; border-radius: 11px; }
    .connections .logo-box { flex-basis: 46px; width: 46px; height: 46px; border-radius: 11px; }
    .connections .logo-box .icon { width: 30px; height: 30px; }
    .connections span { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); }

    /* нижняя панель */
    .content { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; padding: 0 10px env(safe-area-inset-bottom); border-radius: 12px 12px 0 0; background: linear-gradient(175deg, #17372f 0%, var(--card) 45%, #0b1420 100%); box-shadow: 0 -6px 30px rgba(0, 0, 0, .6); }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0; padding: 8px 0; border: 0; overflow: visible; }
    .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 100%; height: 64px; border: 0; border-radius: 12px; font-size: 12px; transition: background .15s, color .15s; }
    .tabs .icon { display: block; width: 24px; height: 24px; }
    .content.open .tabs button[aria-selected="true"] { background: rgba(255, 255, 255, 0.03); }
    .content:not(.open) .tabs button[aria-selected="true"] { color: var(--muted); }
    .sheet { height: 0; overflow-y: auto; overscroll-behavior: contain; visibility: hidden; transition: height .2s ease-out, visibility .2s; }
    .open .sheet { height: 72vh; height: 72dvh; visibility: visible; padding-top: 10px; }
    .toast { bottom: 90px; }
  }
  @media (max-width: 520px) {
    body { padding: 8px 8px 88px; }
    .body { padding: 0 20px 24px; }
    .avatar { left: 16px; top: -54px; width: 124px; height: 124px; }
    .head { height: 82px; }
    .art { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .panel { padding: 14px; }
    .viewer .prev, .viewer .next { top: auto; bottom: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
  // откуда брать список файлов (объявления, значки, арты)
  const REPO = 'Sssmmilles/Sssmmilles.github.io';
  const BRANCH = 'main';
  // эти арты показываются, если список получить не удалось
  const ARTS = [1, 2, 3, 4, 5, 6, 7, 8].map(n => `Images/Arts/pic${n}.png`);

  const $ = id => document.getElementById(id);
  const make = (tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  };

  /* ================= ЧТЕНИЕ ФАЙЛОВ ИЗ Infos ================= */
  async function load(path) {
    const address = path.split('/').map(encodeURIComponent).join('/');
    const response = await fetch(address, { cache: 'no-cache' });
    if (!response.ok) throw new Error(path + ': ' + response.status);
    return (await response.text()).replace(/^﻿/, '').replace(/\r/g, '');
  }

  // понимает и обычный JSON, и простой вид:  { Ключ: значение }
  function parse(source, keys) {
    const data = {};
    try {
      for (const [key, value] of Object.entries(JSON.parse(source))) {
        data[key.toLowerCase()] = Array.isArray(value) ? value.join('\n') : String(value);
      }
      return data;
    } catch { /* не строгий JSON — читаем построчно */ }

    const body = source.trim().replace(/^\{/, '').replace(/\}$/, '');
    let current = null;
    for (const line of body.split('\n')) {
      const found = line.match(/^\s*"?([A-Za-z][A-Za-z ]*?)"?\s*:(.*)$/);
      if (found && keys.includes(found[1].toLowerCase())) {
        current = found[1].toLowerCase();
        data[current] = found[2];
      } else if (current) {
        data[current] += '\n' + line;
      }
    }
    for (const key in data) {
      data[key] = data[key].trim().replace(/^"([\s\S]*)",?$/, '$1');
    }
    return data;
  }

  const FOLDERS = ['Infos/Badges/', 'Infos/Announcements/', 'Images/Arts/'];

  // 1) локальный сервер (Live Server, python -m http.server) показывает содержимое папок
  async function listFromServer(folder, depth = 0) {
    try {
      const response = await fetch(folder, { headers: { Accept: 'text/html' }, cache: 'no-store', signal: AbortSignal.timeout(5000) });
      if (!response.ok || !(response.headers.get('content-type') || '').includes('text/html')) return [];
      const base = new URL(response.url);
      if (!base.pathname.endsWith('/')) base.pathname += '/';
      const root = new URL('.', location.href).pathname;
      const links = new DOMParser().parseFromString(await response.text(), 'text/html').querySelectorAll('a[href]');
      const found = await Promise.all([...links].map(async link => {
        const url = new URL(link.getAttribute('href'), base);
        // берём только то, что лежит внутри этой папки
        if (url.origin !== base.origin || !url.pathname.startsWith(base.pathname) || url.pathname === base.pathname) return [];
        const path = decodeURIComponent(url.pathname.slice(root.length));
        const isFolder = path.endsWith('/') || !/\.[a-z0-9]+$/i.test(path);
        if (!isFolder) return [path];
        return depth < 3 ? listFromServer(path.replace(/\/?$/, '/').split('/').map(encodeURIComponent).join('/'), depth + 1) : [];
      }));
      return [...new Set(found.flat())];
    } catch { return []; }
  }

  // 2) GitHub Pages: список файлов репозитория через GitHub API
  async function listFromGitHub() {
    const saved = 'files:' + REPO;
    try {
      const response = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`,
        { signal: AbortSignal.timeout(8000) });
      if (!response.ok) throw new Error('GitHub API: ' + response.status);
      const files = (await response.json()).tree.filter(f => f.type === 'blob').map(f => f.path);
      try { localStorage.setItem(saved, JSON.stringify(files)); } catch { /* без памяти */ }
      return files;
    } catch (error) {
      console.warn(error);
      try { return JSON.parse(localStorage.getItem(saved)) || []; } catch { return []; }
    }
  }

  // 3) запасной вариант для значков: badge1.json, badge2.json и так далее по порядку
  async function findBadges() {
    const files = [];
    for (let n = 1; n <= 30; n++) {
      const path = `Infos/Badges/badge${n}.json`;
      try { await load(path); } catch { break; }
      files.push(path);
    }
    return files;
  }

  async function listFiles() {
    let files = [];
    if (!location.hostname.endsWith('.github.io')) {
      files = (await Promise.all(FOLDERS.map(folder => listFromServer(folder)))).flat();
    }
    if (!files.some(f => f.startsWith('Infos/'))) files = await listFromGitHub();
    const found = files.some(f => f.startsWith('Infos/')); // получили ли настоящий список
    if (!files.some(f => f.startsWith('Infos/Badges/'))) files = files.concat(await findBadges());
    files.sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
    return { files, found };
  }

  // путь можно писать и с \, и с /
  const fixPath = path => path.trim().replace(/\\/g, '/');

  // ссылки в тексте становятся кликабельными
  function addText(parent, text) {
    text.split(/(https?:\/\/[^\s<>"]+[^\s<>".,!?)])/).forEach((part, index) => {
      if (index % 2) {
        const a = make('a', '', part);
        a.href = part;
        if (!part.startsWith('https://sssmmilles.github.io')) { a.target = '_blank'; a.rel = 'noopener'; }
        parent.append(a);
      } else if (part) {
        parent.append(part);
      }
    });
  }

  /* ================= БУКВЫ ИМЕНИ ================= */
  const nameBox = $('name');
  let letters = [], cursor = null, frame = 0, drag = null;
  function setName(text) {
    nameBox.setAttribute('aria-label', text);
    letters = [...text].map((char, i) => {
      const el = make('span', '', char);
      el.setAttribute('aria-hidden', 'true');
      el.dataset.i = i;
      return { el, x: 0, y: 0, returning: false };
    });
    nameBox.replaceChildren(...letters.map(l => l.el));
    drag = null;
    cursor = null;
  }
  const RADIUS = 40, PUSH = 8, EASE = .12, ROTATE = .6; // зона, сила, плавность, поворот
  function zoomFactor() {
    // .reveal может слегка менять масштаб, поэтому учитываем его
    return nameBox.getBoundingClientRect().width / nameBox.offsetWidth || 1;
  }
  function moveLetters() {
    const zoom = zoomFactor();
    let busy = false;
    for (const letter of letters) {
      if (drag && drag.letter === letter) continue; // буква идёт за курсором напрямую
      let tx = 0, ty = 0;
      if (cursor && !letter.returning) {
        const r = letter.el.getBoundingClientRect();
        const dx = r.left + r.width / 2 - letter.x * zoom - cursor.x;
        const dy = r.top + r.height / 2 - letter.y * zoom - cursor.y;
        const distance = Math.hypot(dx, dy) || 1;
        const force = Math.max(0, 1 - distance / RADIUS) * PUSH;
        tx = dx / distance * force;
        ty = dy / distance * force;
      }
      letter.x += (tx - letter.x) * EASE;
      letter.y += (ty - letter.y) * EASE;
      if (Math.abs(tx - letter.x) + Math.abs(ty - letter.y) > .05) busy = true;
      else {
        letter.x = tx;
        letter.y = ty;
        letter.returning = false;
      }
      letter.el.style.transform = letter.x || letter.y
        ? `translate(${letter.x}px, ${letter.y}px) rotate(${letter.x * ROTATE}deg)` : '';
    }
    frame = busy ? requestAnimationFrame(moveLetters) : 0;
  }
  function startLoop() { if (!frame) frame = requestAnimationFrame(moveLetters); }
  function point(position) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || drag) return;
    cursor = position;
    startLoop();
  }
  function updateDrag(e) {
    const zoom = zoomFactor();
    const letter = drag.letter;
    letter.x = drag.x + (e.clientX - drag.startX) / zoom;
    letter.y = drag.y + (e.clientY - drag.startY) / zoom;
    letter.el.style.transform = `translate(${letter.x}px, ${letter.y}px) rotate(${letter.x * ROTATE}deg)`;
  }
  nameBox.addEventListener('pointerdown', e => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const el = e.target.closest('span');
    const letter = el && letters[+el.dataset.i];
    if (!letter) return;
    drag = { letter, id: e.pointerId, startX: e.clientX, startY: e.clientY, x: letter.x, y: letter.y };
    letter.returning = false;
    letter.el.classList.add('dragging-letter');
    nameBox.classList.add('dragging');
    try { nameBox.setPointerCapture(e.pointerId); } catch (_) {}
    cursor = null;
    e.preventDefault();
  });
  nameBox.addEventListener('pointermove', e => { if (!drag) point({ x: e.clientX, y: e.clientY }); });
  // слушаем окно целиком, чтобы буква шла за курсором за пределами профиля
  window.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) updateDrag(e); });
  function releaseDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const letter = drag.letter;
    letter.el.classList.remove('dragging-letter');
    letter.returning = true; // летим обратно на место, даже если курсор всё ещё рядом
    drag = null;
    nameBox.classList.remove('dragging');
    cursor = null;
    startLoop();
  }
  window.addEventListener('pointerup', releaseDrag);
  window.addEventListener('pointercancel', releaseDrag);
  nameBox.addEventListener('lostpointercapture', releaseDrag);
  nameBox.addEventListener('pointerleave', () => { if (!drag) point(null); });
  setName(nameBox.textContent);

  async function showName() {
    const info = parse(await load('Infos/Profile/Name.json'), ['name', 'username', 'pronouns', 'timezone', 'member since']);
    if (info.name) setName(info.name);
    const meta = [info.username, info.pronouns, info.timezone].filter(Boolean).join(' • ');
    if (meta) $('meta').textContent = meta;
    if (info['member since']) {
      $('since').textContent = info['member since'];
      $('since-section').hidden = false;
    }
  }

  async function showBio() {
    const { text } = parse(await load('Infos/Profile/Description.json'), ['text']);
    if (!text) return;
    for (const line of text.split('\n')) {
      const heading = line.match(/^\s*>\s*(.*)/);
      const item = line.match(/^\s*[-•]\s+(.*)/);
      const el = heading ? make('h3') : make('div', item ? 'item' : '');
      addText(el, heading ? heading[1] : item ? item[1] : line);
      $('bio').append(el);
    }
    $('bio-section').hidden = false;
  }

  /* ================= КАРТОЧКА ЗНАЧКА ================= */
  const card = $('badge-card');
  let cardOwner = null;
  let cardCloseTimer = null;
  function cancelCardClose() {
    clearTimeout(cardCloseTimer);
    cardCloseTimer = null;
  }
  function scheduleCardClose() {
    cancelCardClose();
    // пауза, чтобы курсор успел перейти со значка на саму карточку
    cardCloseTimer = setTimeout(hideCard, 220);
  }
  function showCard(button, badge) {
    cancelCardClose();
    cardOwner = button;
    card.querySelector('img').src = badge.icon;
    card.querySelector('b').textContent = badge.name;
    const text = card.querySelector('p');
    text.textContent = badge.description;
    text.hidden = !badge.description;
    button.setAttribute('aria-describedby', 'badge-card');
    // ставим над значком по центру и не даём выйти за край экрана
    const target = button.getBoundingClientRect();
    const middle = target.left + target.width / 2;
    const width = card.offsetWidth, height = card.offsetHeight;
    const screen = document.documentElement.clientWidth;
    const left = Math.max(8, Math.min(middle - width / 2, screen - width - 8));
    const below = target.top - height - 14 < 8; // сверху не помещается
    card.classList.toggle('below', below);
    card.style.left = left + 'px';
    card.style.top = (below ? target.bottom + 14 : target.top - height - 14) + 'px';
    card.style.setProperty('--arrow', middle - left + 'px');
    card.classList.add('show');
  }
  function hideCard() {
    cancelCardClose();
    cardOwner?.removeAttribute('aria-describedby');
    cardOwner = null;
    card.classList.remove('show');
  }
  function bindCard(button, badge) {
    // мышь: показываем при наведении
    button.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showCard(button, badge); });
    button.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') scheduleCardClose(); });
    // клавиатура
    button.addEventListener('focus', () => { if (button.matches(':focus-visible')) showCard(button, badge); });
    button.addEventListener('blur', hideCard);
    // телефон: нажатие открывает, повторное закрывает
    button.addEventListener('click', e => {
      if (cardOwner === button && e.pointerType === 'touch') hideCard();
      else showCard(button, badge);
    });
  }
  card.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') cancelCardClose(); });
  card.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') scheduleCardClose(); });
  document.addEventListener('click', e => { if (!e.target.closest('.badge') && !e.target.closest('.badge-card')) hideCard(); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });
  addEventListener('scroll', hideCard, { passive: true });
  addEventListener('resize', hideCard);

  async function showBadges(files) {
    const results = await Promise.allSettled(files.map(async file =>
      parse(await load(file), ['name', 'icon', 'description'])));
    for (const { value: badge } of results) {
      if (!badge || !badge.icon) continue;
      const button = make('button', 'badge');
      button.type = 'button';
      const name = badge.name || 'Badge';
      button.setAttribute('aria-label', [name, badge.description].filter(Boolean).join('. '));
      const img = make('img', 'pixel');
      img.src = fixPath(badge.icon);
      img.alt = '';
      button.append(img);
      bindCard(button, { name, description: badge.description || '', icon: img.src });
      $('badges').append(button);
    }
  }

  async function showAnnouncements(files) {
    const results = await Promise.allSettled(files.map(async file => {
      const post = parse(await load(file), ['title', 'text', 'image']);
      // дата берётся из имени файла: ДД-ММ-ГГГГ (можно добавить -2, -3 для того же дня)
      const found = file.match(/(\d{1,2})-(\d{1,2})-(\d{4})(?:-(\d+))?\.\w+$/);
      post.date = found ? new Date(+found[3], found[2] - 1, +found[1]) : null;
      post.order = found ? post.date.getTime() + +(found[4] || 0) : 0;
      return post;
    }));
    const posts = results.map(r => r.value).filter(p => p && (p.text || p.title || p.image))
      .sort((a, b) => b.order - a.order);

    $('posts').replaceChildren();
    if (!posts.length) {
      $('posts').append(make('div', 'panel muted', 'No announcements yet.'));
      return;
    }
    for (const post of posts) {
      const article = make('article', 'panel post');
      const header = make('header');
      const avatar = make('img', 'pixel');
      avatar.src = 'Images/Profile/SssAvatar.png';
      avatar.alt = '';
      const who = make('div');
      who.append(make('b', '', 'Sssmmilles'));
      if (post.date) {
        const time = make('time', '', post.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }));
        time.dateTime = [post.date.getFullYear(), post.date.getMonth() + 1, post.date.getDate()]
          .map(n => String(n).padStart(2, '0')).join('-');
        who.append(time);
      }
      header.append(avatar, who);
      article.append(header);
      if (post.title) article.append(make('h3', '', post.title));
      if (post.text) {
        const text = make('div', 'text rich');
        addText(text, post.text);
        article.append(text);
      }
      if (post.image) {
        const button = make('button', 'zoom');
        button.type = 'button';
        const src = fixPath(post.image);
        button.dataset.view = src;
        button.dataset.caption = post.title || 'Image';
        const img = make('img');
        img.src = src;
        img.alt = post.title || '';
        button.append(img);
        article.append(button);
      }
      $('posts').append(article);
    }
  }

  function showGallery(files) {
    $('gallery').replaceChildren(...files.map((file, index) => {
      const button = make('button', 'zoom');
      button.type = 'button';
      button.dataset.view = file.split('/').map(encodeURIComponent).join('/');
      button.dataset.caption = 'Art ' + (index + 1);
      const img = make('img', 'pixel');
      img.loading = 'lazy';
      img.src = button.dataset.view;
      img.alt = button.dataset.caption;
      button.append(img);
      return button;
    }));
  }

  async function showLists() {
    const notice = text => $('posts').replaceChildren(make('div', 'panel muted', text));
    if (location.protocol === 'file:') {
      // браузер не даёт читать соседние файлы, если страница открыта прямо с компьютера
      notice('Объявления и значки не загрузятся, если открыть index.html двойным кликом. Запусти локальный сервер (например, Live Server) или открой сайт на GitHub Pages.');
      showGallery(ARTS);
      return;
    }
    const { files, found } = await listFiles();
    const inFolder = (folder, types) => files.filter(f => f.startsWith(folder) && types.test(f));
    const arts = inFolder('Images/Arts/', /\.(png|jpe?g|gif|webp)$/i);
    showGallery(arts.length ? arts : ARTS);
    const posts = inFolder('Infos/Announcements/', /\d{1,2}-\d{1,2}-\d{4}(-\d+)?\.(txt|json)$/i);
    await Promise.allSettled([
      showBadges(inFolder('Infos/Badges/', /\.(json|txt)$/i)),
      found ? showAnnouncements(posts) : Promise.resolve(notice(location.hostname.endsWith('.github.io')
        ? 'Could not load announcements. Try again later.'
        : 'Список объявлений не получен: этот сервер не показывает содержимое папок, а на GitHub в Infos их пока нет. Попробуй Live Server или загрузи новую версию на GitHub.'))
    ]);
  }

  const loadInfos = () => Promise.allSettled([showName(), showBio(), showLists()]);

  /* ================= ПРОСМОТР КАРТИНОК ================= */
  const viewer = $('viewer');
  const viewerImg = $('viewer-img');
  let group = [], position = 0;

  const stage = $('stage');
  const MAX_ZOOM = 8;
  let scale = 1, x = 0, y = 0;

  // рисуем текущий масштаб и не даём утащить картинку за край
  function draw(smooth) {
    scale = Math.min(MAX_ZOOM, Math.max(1, scale));
    const limitX = Math.max(0, (viewerImg.offsetWidth * scale - stage.clientWidth) / 2);
    const limitY = Math.max(0, (viewerImg.offsetHeight * scale - stage.clientHeight) / 2);
    x = Math.min(limitX, Math.max(-limitX, x));
    y = Math.min(limitY, Math.max(-limitY, y));
    viewerImg.classList.toggle('smooth', !!smooth);
    viewerImg.classList.toggle('zoomed', scale > 1);
    viewerImg.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    $('zoom-level').textContent = Math.round(scale * 100) + '%';
  }
  // приблизить так, чтобы точка под курсором или пальцем осталась на месте
  function zoomTo(next, clientX, clientY, smooth) {
    next = Math.min(MAX_ZOOM, Math.max(1, next));
    const box = stage.getBoundingClientRect();
    const px = clientX === undefined ? 0 : clientX - box.left - box.width / 2;
    const py = clientY === undefined ? 0 : clientY - box.top - box.height / 2;
    x = px - (px - x) * next / scale;
    y = py - (py - y) * next / scale;
    scale = next;
    draw(smooth);
  }
  function fit() {
    const { naturalWidth: w, naturalHeight: h } = viewerImg;
    if (!w) return;
    const size = Math.min(innerWidth * .9 / w, (innerHeight - 220) / h);
    viewerImg.style.width = Math.max(1, Math.round(w * size)) + 'px';
    scale = 1; x = y = 0;
    draw();
  }
  function view(index) {
    position = (index + group.length) % group.length;
    const { view: src, caption } = group[position].dataset;
    viewerImg.removeAttribute('style');
    viewerImg.src = src;
    viewerImg.alt = caption;
    $('viewer-caption').textContent = caption;
    $('viewer-link').href = src;
    if (viewerImg.complete) fit();
  }
  viewerImg.addEventListener('load', fit);
  addEventListener('resize', () => { if (viewer.open) fit(); });

  // мышь и пальцы: нажатие — приблизить, тянуть — двигать, два пальца — масштаб
  const pointers = new Map();
  let moved = false, pressed = null, start;
  stage.addEventListener('pointerdown', e => {
    if (e.button) return;
    stage.setPointerCapture(e.pointerId);
    if (!pointers.size) { moved = false; pressed = e.target; start = e; }
    else moved = true;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  const middle = () => {
    const [a, b] = [...pointers.values()];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, size: Math.hypot(a.x - b.x, a.y - b.y) };
  };
  stage.addEventListener('pointermove', e => {
    const last = pointers.get(e.pointerId);
    if (!last) return;
    const before = pointers.size === 2 ? middle() : null;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.hypot(e.clientX - start.clientX, e.clientY - start.clientY) > 6) moved = true;
    if (before) {
      const now = middle();
      if (before.size) zoomTo(scale * now.size / before.size, now.x, now.y);
      x += now.x - before.x;
      y += now.y - before.y;
      draw();
    } else if (pointers.size === 1 && moved) {
      x += e.clientX - last.x;
      y += e.clientY - last.y;
      draw();
    }
  });
  const release = e => pointers.delete(e.pointerId);
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('lostpointercapture', release);
  stage.addEventListener('click', e => {
    if (moved) return;
    if (pressed === viewerImg) zoomTo(scale > 1 ? 1 : 3, e.clientX, e.clientY, true);
    else viewer.close();
  });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    zoomTo(scale * Math.exp(-e.deltaY * .002), e.clientX, e.clientY);
  }, { passive: false });
  $('zoom-in').addEventListener('click', () => zoomTo(scale * 1.5, undefined, undefined, true));
  $('zoom-out').addEventListener('click', () => zoomTo(scale / 1.5, undefined, undefined, true));

  document.addEventListener('click', e => {
    const button = e.target.closest('[data-view]');
    if (!button) return;
    const gallery = button.closest('#gallery');
    group = gallery ? [...gallery.children] : [button];
    viewer.querySelector('.prev').hidden = viewer.querySelector('.next').hidden = group.length < 2;
    pointers.clear();
    viewer.showModal();
    view(group.indexOf(button));
  });
  viewer.querySelector('.close').addEventListener('click', () => viewer.close());
  viewer.querySelector('.prev').addEventListener('click', () => view(position - 1));
  viewer.querySelector('.next').addEventListener('click', () => view(position + 1));
  viewer.addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zoomTo(scale * 1.5, undefined, undefined, true);
    if (e.key === '-') zoomTo(scale / 1.5, undefined, undefined, true);
    if (e.key === '0') zoomTo(1, undefined, undefined, true);
    if (group.length < 2) return;
    if (e.key === 'ArrowLeft') view(position - 1);
    if (e.key === 'ArrowRight') view(position + 1);
  });

  /* ================= ВКЛАДКИ ================= */
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const mobile = matchMedia('(max-width: 960px)');
  const content = $('content');
  function setSheet(open) {
    content.classList.toggle('open', open);
    tabs.forEach(t => mobile.matches
      ? t.setAttribute('aria-expanded', open && t.getAttribute('aria-selected') === 'true')
      : t.removeAttribute('aria-expanded'));
  }
  // нажатие мимо панели и Escape закрывают её
  document.addEventListener('click', e => {
    if (!mobile.matches || !content.classList.contains('open') || e.target.closest('#content, #viewer')) return;
    e.preventDefault();
    e.stopPropagation(); // это нажатие только закрывает панель
    setSheet(false);
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !viewer.open) setSheet(false); });
  function openTab(tab) {
    tabs.forEach(t => {
      const active = t === tab;
      t.setAttribute('aria-selected', active);
      t.tabIndex = active ? 0 : -1;
      $(t.getAttribute('aria-controls')).hidden = !active;
    });
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => {
      // повторное нажатие на открытую вкладку закрывает панель
      const again = tab.getAttribute('aria-selected') === 'true' && content.classList.contains('open');
      openTab(tab);
      if (mobile.matches) setSheet(!again);
      $('sheet').scrollTop = 0;
      // ссылка вида .../#art открывает нужную вкладку
      history.replaceState(null, '', '#' + tab.getAttribute('aria-controls'));
    });
    tab.addEventListener('keydown', e => {
      const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
      if (!step) return;
      const next = tabs[(index + step + tabs.length) % tabs.length];
      next.focus();
      next.click();
    });
  });
  const openFromAddress = () => {
    const hash = location.hash === '#art' ? '#arts' : location.hash;
    const tab = tabs.find(t => '#' + t.getAttribute('aria-controls') === hash);
    // ссылка выбирает вкладку, но не раскрывает панель на узком экране
    if (tab) openTab(tab);
  };
  addEventListener('hashchange', openFromAddress);
  // по умолчанию нижняя панель закрыта (в том числе после перезагрузки с #arts)
  setSheet(false);
  mobile.addEventListener('change', e => { if (e.matches) setSheet(false); });
  openFromAddress();

  /* ================= МЕНЮ «...» ================= */
  const more = $('more'), menu = $('menu'), toast = $('toast');
  let timer;
  function setMenu(open) {
    menu.hidden = !open;
    more.setAttribute('aria-expanded', open);
  }
  more.addEventListener('click', e => { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  menu.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', async () => {
    let message = 'Copied!';
    try { await navigator.clipboard.writeText(button.dataset.copy); }
    catch { message = button.dataset.copy; }
    setMenu(false);
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(() => toast.hidden = true, 2000);
  }));

  /* ================= ПЛАВНОЕ ОТКРЫТИЕ ================= */
  const banner = document.querySelector('.banner img');
  Promise.allSettled([loadInfos(), banner.decode(), document.fonts.ready])
    .then(() => requestAnimationFrame(() => document.documentElement.classList.add('ready')));
</script>
</body>
</html>
